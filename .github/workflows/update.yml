name: 2h Node Update

on:
  schedule:
    # 对应北京时间：08, 10, 12, 14, 16, 18, 20, 22, 00
    - cron: '0 0,2,4,6,8,10,12,14,16 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests dnspython

      - name: Run Script
        run: python main.py

      - name: Commit and Push
        run: |
          git config --global user.name "Bot"
          git config --global user.email "actions@github.com"
          git add config.json
          git commit -m "Auto Update: $(date +'%Y-%m-%d %H:%M:%S') CST" || exit 0
          git push
