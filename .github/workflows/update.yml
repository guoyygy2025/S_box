name: Update Sing-box Config

# 配置触发条件
on:
  workflow_dispatch:          # 支持手动点击 "Run workflow" 触发
  schedule:
    - cron: '0 23,1,3,5,7,9,11,13 * * *'
  push:
    branches:
      - main                  # 当 main 分支有代码推送时触发

jobs:
  update-config:
    runs-on: ubuntu-latest
    
    # 授予 Actions 写入仓库的权限
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Update Script
        run: python main.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 检查文件是否有变动，避免空的 commit 报错
          git add config.json
          if git diff --staged --quiet; then
            echo "No changes in config.json, skipping push."
          else
            git commit -m "chore: auto update sing-box nodes [$(date '+%Y-%m-%d %H:%M')]"
            git push
          fi
