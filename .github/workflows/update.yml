name: Node Update Service

on:
  schedule:
    # 北京时间早7点到晚9点，每两小时更新一次 (UTC: 23, 1, 3, 5, 7, 9, 11, 13)
    - cron: '0 23,1,3,5,7,9,11,13 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Download Rule Sets to Local
        run: |
          mkdir -p rules
          curl -L -o rules/geoip-cn.srs https://gh-proxy.org/https://raw.githubusercontent.com/SagerNet/sing-geoip/rule-set/geoip-cn.srs
          curl -L -o rules/geosite-cn.srs https://gh-proxy.org/https://raw.githubusercontent.com/SagerNet/sing-geosite/rule-set/geosite-cn.srs

      - name: Run Script
        run: python main.py

      - name: Deploy Result
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add config.json rules/*.srs
          git commit -m "Auto Update Nodes & Rules: $(date +'%Y-%m-%d %H:%M:%S')" || exit 0
          git push
